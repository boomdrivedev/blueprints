# blueprints' gate: sluice lands every change onto main, which lives on
# GitHub; every round fetches main from origin and forms on what it holds,
# and a landing is a leased push as the host's [forge] app, the Boomdrive
# App. No check reads Markdown (blueprints principle 16), so main requires
# none: a change lands as it is, in the order it was submitted.
[tests]
# blueprints has no task runner; with no required check, nothing runs.
runner = "command"
command = "true"

[branches.main]
# no checks: lands untested, by choice
required = []
parallel = 2
batch = false
flaky = "fail"
timeout = "10m"
remote = "origin"

[branches.main.pull_requests]
reviews = 0
